<!-- ====== Navbar ====== -->
<nav class="navbar navbar-expand-lg fm-navbar">
  <div class="container">
    <a class="navbar-brand" href="{% url 'forecast:upload' %}">
      <span class="brand-icon"><i class="bi bi-graph-up-arrow"></i></span>
      FinanceModel
    </a>

    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navMain"
            aria-controls="navMain" aria-expanded="false" aria-label="Menú">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav ms-auto align-items-center gap-1">

        <li class="nav-item">
          <a class="nav-link{% if request.resolver_match.url_name == 'upload' %} active{% endif %}"
             href="{% url 'forecast:upload' %}">
            <i class="bi bi-cloud-upload me-1"></i>Nuevo Forecast
          </a>
        </li>

        {% if user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link{% if request.resolver_match.url_name == 'project_list' %} active{% endif %}"
               href="{% url 'forecast:project_list' %}">
              <i class="bi bi-folder2-open me-1"></i>Mis Proyectos
            </a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link nav-user-badge dropdown-toggle" href="#"
               role="button" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle me-1"></i>{{ user.username }}
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <form method="post" action="{% url 'logout' %}">
                  {% csrf_token %}
                  <button type="submit" class="dropdown-item text-danger">
                    <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
                  </button>
                </form>
              </li>
            </ul>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'login' %}">
              <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión
            </a>
          </li>
          <li class="nav-item">
            <a class="btn btn-fm-primary btn-sm ms-1" href="{% url 'register' %}">
              <i class="bi bi-person-plus me-1"></i>Registrarse
            </a>
          </li>
        {% endif %}

      </ul>
    </div>
  </div>
</nav>
